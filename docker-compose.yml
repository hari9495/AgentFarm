services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentfarm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentfarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-agentfarm}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agentfarm}' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentfarm
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: agentfarm-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentfarm
    restart: unless-stopped

  opa:
    # NOTE: must be the -debug variant — the -static image is distroless (no
    # /bin/sh, no wget), which makes any CMD-SHELL healthcheck fail forever.
    image: openpolicyagent/opa:0.68.0-debug
    container_name: agentfarm-opa
    command: [ 'run', '--server', '--addr', '0.0.0.0:8181' ]
    ports:
      - '8181:8181'
    healthcheck:
      # OPA /health returns {} (HTTP 200) when running â€” check for HTTP 200
      test: [ 'CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8181/health && exit 0 || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - agentfarm
    restart: unless-stopped

  voicebox:
    image: ghcr.io/voicebox-ai/voicebox:latest
    container_name: voicebox
    ports:
      - '17493:17493'
    environment:
      - PORT=17493
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:17493/health || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentfarm
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      target: builder
    container_name: agentfarm-migrate
    command: >
      sh -c "pnpm --filter @agentfarm/db-schema prisma:migrate:deploy"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-agentfarm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentfarm}}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agentfarm

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: agentfarm-api-gateway
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-agentfarm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentfarm}}
      REDIS_URL: redis://redis:6379
      OPA_BASE_URL: http://opa:8181
      API_GATEWAY_PORT: '3000'
      NODE_ENV: production
      API_SESSION_SECRET: ${API_SESSION_SECRET}
      VOXCPM2_URL: ${VOXCPM2_URL:-http://127.0.0.1:8765}
      VOICEBOX_URL: http://voicebox:17493
      BROWSER_AGENT_URL: ${BROWSER_AGENT_URL:-http://browser-agent:5002}
      DESKTOP_AGENT_URL: ${DESKTOP_AGENT_URL:-http://desktop-agent:5003}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3001}
      # Portal email (password reset / email verification)
      # Option 1 — Zoho ZeptoMail (https://zeptomail.com) — transactional API
      ZEPTOMAIL_API_TOKEN: ${ZEPTOMAIL_API_TOKEN:-}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL:-https://api.zeptomail.in/v1.1/email}
      # Option 2 — Resend (https://resend.com, free tier: 3,000 emails/month)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PORTAL_EMAIL_FROM: ${PORTAL_EMAIL_FROM:-AgentFarms <noreply@agentfarms.in>}
      PORTAL_APP_BASE_URL: ${PORTAL_APP_BASE_URL:-http://localhost:3002}
      # Bypass email verification on portal signup when no SMTP is configured
      # (single-host / demo deployments). Leave false in production.
      PORTAL_SKIP_EMAIL_VERIFICATION: ${PORTAL_SKIP_EMAIL_VERIFICATION:-}
      # Require company email on signup (block free providers). Default on.
      SIGNUP_BLOCK_FREE_EMAIL: ${SIGNUP_BLOCK_FREE_EMAIL:-true}
      SIGNUP_BLOCKED_EMAIL_DOMAINS: ${SIGNUP_BLOCKED_EMAIL_DOMAINS:-}
      # Option 2 — generic webhook fallback (set if not using Resend)
      PORTAL_RESET_WEBHOOK_URL: ${PORTAL_RESET_WEBHOOK_URL:-}
      # Internal dashboard login — allow operators with @agentfarms.in email or owner role
      API_INTERNAL_LOGIN_ALLOWED_DOMAINS: ${API_INTERNAL_LOGIN_ALLOWED_DOMAINS:-agentfarms.in}
      API_INTERNAL_LOGIN_ADMIN_ROLES: ${API_INTERNAL_LOGIN_ADMIN_ROLES:-owner}
      # Inter-service auth — connector execute endpoint
      AGENTFARM_CONNECTOR_EXEC_SHARED_TOKEN: ${CONNECTOR_EXEC_SHARED_TOKEN}
      # Persist env:// connector secrets across restarts (no Key Vault required in dev)
      CONNECTOR_SECRETS_PATH: /data/connector-secrets.json
      # Agent runtime — portal task submission proxies to this service.
      # Hardcoded (not ${AGENT_RUNTIME_URL}) because .env sets localhost:4000
      # for host tooling, which is unreachable from inside this container.
      AGENT_RUNTIME_URL: http://agent-runtime:4000
      # Workers run in-process by default. Set AF_WORKERS_DISABLED=1 only when
      # running the standalone worker-runner service (profile: split-workers)
      # to prevent duplicate worker execution in both processes.
      AF_WORKERS_DISABLED: ${AF_WORKERS_DISABLED:-}
      # Single-host deployments have no per-tenant Azure VMs: provisioning jobs
      # activate the bot directly. Set to 'false' when Azure provisioning is used.
      AF_SKIP_PROVISIONING: ${AF_SKIP_PROVISIONING:-true}
    volumes:
      - gateway_secrets:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - agentfarm
    restart: unless-stopped

  worker-runner:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: agentfarm-worker-runner
    # Opt-in split-worker mode: start with `docker compose --profile split-workers up`
    # AND set AF_WORKERS_DISABLED=1 on api-gateway to avoid duplicate workers.
    profiles: [ split-workers ]
    # Same image as api-gateway; different entrypoint runs workers only.
    command: [ 'node', 'apps/api-gateway/dist/worker-main.js' ]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-agentfarm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentfarm}}
      REDIS_URL: redis://redis:6379
      OPA_BASE_URL: http://opa:8181
      NODE_ENV: production
      API_SESSION_SECRET: ${API_SESSION_SECRET}
      AGENT_RUNTIME_URL: http://agent-runtime:4000
    depends_on:
      api-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentfarm
    restart: unless-stopped

  browser-agent:
    build:
      context: ./services/browser-agent
      dockerfile: Dockerfile
    container_name: agentfarm-browser-agent
    ports:
      - '5002:5002'
    environment:
      PORT: '5002'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-120000}
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:5002/health || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agentfarm
    restart: unless-stopped

  agent-runtime:
    build:
      context: .
      dockerfile: apps/agent-runtime/Dockerfile
    container_name: agentfarm-agent-runtime
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-agentfarm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentfarm}}
      RUNTIME_PORT: '4000'
      AF_HEALTH_PORT: '4000'
      API_GATEWAY_URL: http://api-gateway:3000
      VOICEBOX_URL: http://voicebox:17493
      BROWSER_AGENT_URL: http://browser-agent:5002
      DESKTOP_AGENT_URL: http://desktop-agent:5003
      DESKTOP_AGENT_TOKEN: ${DESKTOP_AGENT_TOKEN:-}
      NODE_ENV: production
      AF_ACTION_RESULT_LOG_PATH: /data/action-results.ndjson
      AF_TENANT_ID: ${AF_TENANT_ID:-yukthix-consulting-a2362a}
      AF_WORKSPACE_ID: ${AF_WORKSPACE_ID:-cmq72f1fk003zkx4smdyay6yf}
      AF_BOT_ID: ${AF_BOT_ID:-cmq72f1fr0044kx4s52rpy9px}
      AF_ROLE_PROFILE: ${AF_ROLE_PROFILE:-developer}
      AF_POLICY_PACK_VERSION: ${AF_POLICY_PACK_VERSION:-1.0.0}
      AF_APPROVAL_API_URL: ${AF_APPROVAL_API_URL:-http://api-gateway:3000}
      AF_EVIDENCE_API_URL: ${AF_EVIDENCE_API_URL:-http://api-gateway:3000}
      AF_LOG_LEVEL: ${AF_LOG_LEVEL:-info}
      AF_RUNTIME_CONTRACT_VERSION: ${AF_RUNTIME_CONTRACT_VERSION:-1.0.0}
      AGENTFARM_APPROVAL_INTAKE_SHARED_TOKEN: ${APPROVAL_INTAKE_SHARED_TOKEN:-dev-approval-token}
      AGENTFARM_CONNECTOR_EXEC_SHARED_TOKEN: ${CONNECTOR_EXEC_SHARED_TOKEN}
      # Self-activate on boot: run the /startup bootstrap automatically so a
      # container restart doesn't leave the runtime stuck in state=created.
      AF_RUNTIME_AUTOSTART: ${AF_RUNTIME_AUTOSTART:-1}
      AF_MODEL_PROVIDER: ${AF_MODEL_PROVIDER:-openai}
      AF_OPENAI_API_KEY: ${AF_OPENAI_API_KEY:-}
      AF_OPENAI_BASE_URL: ${AF_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AF_OPENAI_MODEL: ${AF_OPENAI_MODEL:-gpt-4o}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REDIS_URL: redis://redis:6379
    volumes:
      - agent_data:/data
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      # /health returns 200 even while the runtime is still in state=created,
      # so assert the body reports ok:true (startup bootstrap completed).
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health | grep -q ''"ok":true'' || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - agentfarm
    restart: unless-stopped

  trigger-service:
    build:
      context: .
      dockerfile: apps/trigger-service/Dockerfile
    container_name: agentfarm-trigger-service
    environment:
      TRIGGER_SERVICE_PORT: '3002'
      AGENT_RUNTIME_URL: http://agent-runtime:4000
      NODE_ENV: production
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://api-gateway:3000}
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/health || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agentfarm
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: agentfarm-dashboard
    ports:
      - '3001:3001'
    environment:
      DASHBOARD_API_BASE_URL: http://api-gateway:3000
      NODE_ENV: production
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN}
      REDIS_URL: redis://redis:6379
      # OTP/MFA email domain allowlist (defaults to agentfarms.in when unset)
      DASHBOARD_ALLOWED_DOMAINS: ${DASHBOARD_ALLOWED_DOMAINS:-}
      DASHBOARD_PRIMARY_DOMAIN: ${DASHBOARD_PRIMARY_DOMAIN:-}
      # Meeting-agent live controls (join, stop, transcript, chat)
      MEETING_AGENT_URL: http://meeting-agent:7799
      MEETING_AGENT_TOKEN: ${MEETING_AGENT_TOKEN:-}
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:3001 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - agentfarm
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    container_name: agentfarm-website
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      # Portal API + auth proxy target (server-side calls to the gateway)
      API_GATEWAY_URL: http://api-gateway:3000
      # Public site URL — used for magic links and email callbacks. Override
      # with the externally reachable URL (Cloudflare tunnel / domain) at deploy.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
      # Internal dashboard URL shown to company members after login
      AGENTFARM_INTERNAL_DASHBOARD_URL: ${AGENTFARM_INTERNAL_DASHBOARD_URL:-http://localhost:3001}
      # Signup allowlist — comma-separated domains/emails (empty = open signup)
      AGENTFARM_ALLOWED_SIGNUP_DOMAINS: ${AGENTFARM_ALLOWED_SIGNUP_DOMAINS:-}
      AGENTFARM_ALLOWED_SIGNUP_EMAILS: ${AGENTFARM_ALLOWED_SIGNUP_EMAILS:-}
      # NOTE: the customer portal proxies all auth to the api-gateway (cookie-based
      # portal sessions), so the website's SQLite D1 fallback is not required here.
      # Set WEBSITE_AUTH_DB_PATH only if the marketing-site magic-link auth is needed.
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:3002 || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - agentfarm
    restart: unless-stopped

  desktop-agent:
    build:
      context: ./docker/desktop-agent
      dockerfile: Dockerfile
    container_name: agentfarm-desktop-agent
    mem_limit: 3g
    shm_size: 512m
    ports:
      - '5003:5003' # Agent API
      - '6080:6080' # noVNC WebSocket stream
      - '7800:7800' # pipecat voice sidecar (gated by ENABLE_VOICE_SIDECAR)
    environment:
      APP_PORT: '5003'
      NOVNC_PORT: '6080'
      VNC_PORT: '5901'
      DISPLAY: ':99'
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAX_VISION_STEPS: ${MAX_VISION_STEPS:-20}
      VISION_LOOP_TIMEOUT: ${VISION_LOOP_TIMEOUT:-300}
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
      API_GATEWAY_URL: http://api-gateway:3000
      DESKTOP_AGENT_TOKEN: ${DESKTOP_AGENT_TOKEN:-}
      # Test tool paths
      JMETER_HOME: /opt/jmeter
      APPIUM_SERVER_URL: http://127.0.0.1:4723
      ZAP_HOME: /opt/zaproxy
      # Voice sidecar (pipecat_sidecar.py). On by default â€” set to 0 to
      # disable PulseAudio + Silero VAD + faster-whisper inside the container.
      ENABLE_VOICE_SIDECAR: ${ENABLE_VOICE_SIDECAR:-1}
      PIPECAT_PORT: '7800'
      PIPECAT_TOKEN: ${PIPECAT_TOKEN:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      PULSE_INJECT_SINK: ${PULSE_INJECT_SINK:-AgentMic}
      # pipecat captures MeetingOut.monitor to hear participant speech.
      # pulse-setup.sh creates MeetingOut as the default output sink so
      # Chromium routes its audio (what participants say) there.
      PULSE_MONITOR_SOURCE: ${PULSE_MONITOR_SOURCE:-MeetingOut.monitor}
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:5003/health || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agentfarm
    restart: unless-stopped

  meeting-agent:
    build:
      context: .
      dockerfile: services/meeting-agent/Dockerfile
    container_name: agentfarm-meeting-agent
    ports:
      - '7799:7799'
    environment:
      MEETING_AGENT_PORT: '7799'
      MEETING_AGENT_HOST: '0.0.0.0'
      MEETING_AGENT_TOKEN: ${MEETING_AGENT_TOKEN:-}
      # Default to the voxcpm container exposed by this compose file. Override
      # SUPERTONIC_URL to point at a hosted TTS gateway if needed.
      SUPERTONIC_URL: ${SUPERTONIC_URL:-http://voxcpm:8765}
      SUPERTONIC_API_KEY: ${SUPERTONIC_API_KEY:-}
      SUPERTONIC_MODEL: ${SUPERTONIC_MODEL:-supertonic}
      # Voice fan-out: when ENABLE_VOICE_SIDECAR=1 the desktop-agent exposes
      # the pipecat sidecar on port 7800; meeting-agent forwards each /say
      # payload's audio there so it lands on the meeting microphone, and
      # auto-engages live capture at /start so the sidecar posts inbound
      # utterances back to /v1/sessions/:id/transcript/inbound on this same
      # service via MEETING_AGENT_PUBLIC_URL.
      DESKTOP_AGENT_VOICE_URL: ${DESKTOP_AGENT_VOICE_URL:-http://desktop-agent:7800}
      DESKTOP_AGENT_VOICE_TOKEN: ${PIPECAT_TOKEN:-}
      MEETING_AGENT_PUBLIC_URL: ${MEETING_AGENT_PUBLIC_URL:-http://meeting-agent:7799}
      # Used by POST /v1/sessions/:id/join to launch the Playwright browser
      # join script on the desktop-agent (port 5003 control plane).
      DESKTOP_AGENT_URL: ${DESKTOP_AGENT_URL:-http://desktop-agent:5003}
      # LLM brain for autonomous meeting responses.
      # Defaults to anthropic using the same ANTHROPIC_API_KEY already set for
      # the rest of the stack. Override MEETING_BRAIN_PROVIDER=openai and
      # MEETING_BRAIN_API_KEY=<openai-key> to switch providers.
      MEETING_BRAIN_PROVIDER: ${MEETING_BRAIN_PROVIDER:-anthropic}
      MEETING_BRAIN_API_KEY: ${MEETING_BRAIN_API_KEY:-${ANTHROPIC_API_KEY:-}}
      MEETING_BRAIN_BASE_URL: ${MEETING_BRAIN_BASE_URL:-}
      MEETING_BRAIN_MODEL: ${MEETING_BRAIN_MODEL:-claude-sonnet-4-6}
      MEETING_BRAIN_SYSTEM_PROMPT: ${MEETING_BRAIN_SYSTEM_PROMPT:-}
      MEETING_BRAIN_MAX_TOKENS: ${MEETING_BRAIN_MAX_TOKENS:-}
      # â”€â”€ Self-hosted voice stack (active when --profile voice is used) â”€â”€â”€â”€â”€â”€
      # Whisper STT â€” points at the whisper service (port 9090).
      # Set sttProvider=whisper_local in VoicePipelineConfig to use this.
      WHISPER_ENDPOINT: ${WHISPER_ENDPOINT:-http://whisper:8000}
      # Kokoro TTS â€” OpenAI-compatible endpoint.
      # To replace VoxCPM2 with Kokoro: set SUPERTONIC_URL=http://kokoro:8880
      KOKORO_ENDPOINT: ${KOKORO_ENDPOINT:-http://kokoro:8880}
      # XTTS v2 â€” 17-language TTS. Active when --profile voice is used.
      XTTS_ENDPOINT: ${XTTS_ENDPOINT:-http://xtts:5002}
      # Meta MMS-TTS â€” 1100+ languages. Active when --profile voice is used.
      MMS_TTS_ENDPOINT: ${MMS_TTS_ENDPOINT:-http://mms-tts:5002}
      # â”€â”€ FreeSWITCH SIP â€” universal meeting dial-in â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # Used by SipJoinAdapter to originate SIP calls into any meeting platform.
      # Active when the freeswitch service is running (--profile voice).
      FREESWITCH_ESL_HOST: ${FREESWITCH_ESL_HOST:-freeswitch}
      FREESWITCH_ESL_PORT: ${FREESWITCH_ESL_PORT:-8021}
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:-ClueCon}
      FREESWITCH_SIP_PROFILE: ${FREESWITCH_SIP_PROFILE:-external}
      # â”€â”€ Meeting platform native SDK credentials â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # Microsoft Teams â€” Graph API calling bot.
      # Requires: Calls.JoinGroupCall.All, OnlineMeetings.ReadWrite.All
      TEAMS_TENANT_ID: ${TEAMS_TENANT_ID:-}
      TEAMS_CLIENT_ID: ${TEAMS_CLIENT_ID:-}
      TEAMS_CLIENT_SECRET: ${TEAMS_CLIENT_SECRET:-}
      TEAMS_BOT_DISPLAY_NAME: ${TEAMS_BOT_DISPLAY_NAME:-AgentFarm Bot}
      # teams-media-bot sidecar (active when --profile voice is used).
      # When set, join() uses applicationHostedMediaConfig and startScreenShare()
      # relays the FFmpeg HLS stream to the Teams media endpoint via the sidecar.
      TEAMS_MEDIA_BOT_URL: ${TEAMS_MEDIA_BOT_URL:-http://teams-media-bot:8090}
      # Public URL Teams can POST callbacks (ICE/DTLS negotiation) to.
      # Must be reachable from Microsoft's servers â€” use ngrok or Azure Relay in dev.
      TEAMS_CALLBACK_BASE_URL: ${TEAMS_CALLBACK_BASE_URL:-}
      # Zoom â€” Server-to-Server OAuth app (marketplace.zoom.us).
      # Requires scopes: meeting:write:admin, meeting:read:admin
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      # zoom-video-sidecar (active when --profile voice is used).
      # When set, ZoomJoinAdapter.join() delegates browser join to the sidecar
      # and startScreenShare() triggers the in-meeting Share button via xdotool.
      ZOOM_VIDEO_SIDECAR_URL: ${ZOOM_VIDEO_SIDECAR_URL:-http://zoom-video-sidecar:8091}
    depends_on:
      voxcpm:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:7799/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentfarm
    restart: unless-stopped

  voxcpm:
    build:
      context: ./docker/voxcpm2
      dockerfile: Dockerfile
    container_name: agentfarm-voxcpm
    ports:
      - '8765:8765'
    environment:
      PORT: '8765'
      SAMPLE_RATE: '22050'
    healthcheck:
      test: [ 'CMD-SHELL', 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8765/health\").status==200 else 1)"' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - agentfarm
    restart: unless-stopped

  # â”€â”€ Self-hosted open-source voice stack (zero per-call cost) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  #
  # Enable:  docker compose --profile voice up
  # Or add:  COMPOSE_PROFILES=voice  to your .env file
  #
  # These seven services replace paid APIs or add native platform capabilities:
  #   whisper          â†’ Sarvam AI / Deepgram  (STT, 99 languages)
  #   kokoro           â†’ Sarvam Bulbul / VoxCPM2 (TTS, English, OpenAI-compatible)
  #   freeswitch       â†’ Twilio SIP (universal meeting dial-in via SipJoinAdapter)
  #   xtts             â†’ Coqui XTTS v2 (TTS, 17 languages, zero cost)
  #   mms-tts          â†’ Meta MMS-TTS (TTS, 1100+ languages, zero cost)
  #   teams-media-bot  â†’ Teams native screen share (applicationHostedMediaConfig + DTLS-SRTP)
  #   zoom-video-sidecar â†’ Zoom native screen share (Playwright browser + xdotool)
  #
  # First boot downloads models (whisper ~1.5 GB, kokoro ~300 MB, xtts ~2 GB).
  # MMS-TTS models download on first request per language (~30-100 MB each).
  # Set COMPOSE_PROFILES=voice in .env to include these on every `docker compose up`.

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: agentfarm-whisper
    profiles: [ voice ]
    ports:
      - '9090:8000'
    environment:
      # Model: medium balances speed and accuracy for 99 languages.
      # Upgrade to large-v3 for best accuracy (needs more RAM).
      WHISPER__MODEL: ${WHISPER_STT_MODEL:-Systran/faster-whisper-medium}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - whisper_models:/root/.cache/huggingface
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/health || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Model download on first boot â€” allow up to 3 minutes.
      start_period: 180s
    networks:
      - agentfarm
    restart: unless-stopped

  kokoro:
    # OpenAI-compatible TTS â€” drop-in replacement for the /v1/audio/speech endpoint.
    # Works as SUPERTONIC_URL=http://kokoro:8880 for the meeting-agent /say path.
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    container_name: agentfarm-kokoro
    profiles: [ voice ]
    ports:
      - '8880:8880'
    volumes:
      - kokoro_models:/app/models
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:8880/health || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - agentfarm
    restart: unless-stopped

  freeswitch:
    # FreeSWITCH SIP server â€” used by SipJoinAdapter to dial into any meeting
    # platform (Teams, Zoom, Meet, Webex) as an audio-only participant.
    # ESL password defaults to "ClueCon" â€” change via FREESWITCH_ESL_PASSWORD.
    build:
      context: ./docker/freeswitch
      dockerfile: Dockerfile
    container_name: agentfarm-freeswitch
    profiles: [ voice ]
    ports:
      - '5060:5060/udp'   # SIP signaling â€” internal profile
      - '5060:5060/tcp'
      - '5080:5080/udp'   # SIP signaling â€” external/outbound profile
      - '5080:5080/tcp'
      - '8021:8021'       # ESL (Event Socket Layer) â€” used by SipJoinAdapter
      - '16384-16484:16384-16484/udp'  # RTP media (100-port range, ~50 calls)
    environment:
      ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:-ClueCon}
    volumes:
      - freeswitch_db:/var/lib/freeswitch
      - freeswitch_log:/var/log/freeswitch
    healthcheck:
      test: [ 'CMD-SHELL', 'nc -z 127.0.0.1 8021 || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - agentfarm
    restart: unless-stopped

  xtts:
    # XTTS v2 â€” 17-language self-hosted TTS (Coqui).
    # API: POST /tts_to_audio/ { text, language, speaker_wav? } â†’ WAV bytes.
    # Used by meeting-agent when ttsProvider="xtts" (languages: es fr de it pt pl tr ru nl cs ar zh ja hu ko hi).
    # First start downloads the XTTS v2 model (~2 GB). Cached in xtts_models volume.
    image: daswer123/xtts-api-server:latest
    container_name: agentfarm-xtts
    profiles: [ voice ]
    ports:
      - '5004:5002'
    volumes:
      - xtts_models:/root/.local/share/tts
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:5002/docs || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Model download on first boot â€” allow up to 5 minutes.
      start_period: 300s
    networks:
      - agentfarm
    restart: unless-stopped

  mms-tts:
    # Meta MMS-TTS â€” 1100+ language self-hosted TTS fallback.
    # API: POST /api/tts { text, language } â†’ WAV bytes.
    # Used by meeting-agent when ttsProvider="mms_tts" (any language not covered by XTTS).
    # Models download on first request per language (~30-100 MB each). Cached in mms_tts_models volume.
    build:
      context: ./docker/mms-tts
      dockerfile: Dockerfile
    container_name: agentfarm-mms-tts
    profiles: [ voice ]
    ports:
      - '5005:5002'
    volumes:
      - mms_tts_models:/root/.cache/huggingface
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:5002/health || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agentfarm
    restart: unless-stopped

  zoom-video-sidecar:
    # Zoom screen share sidecar â€” Node.js 20 orchestration service.
    # Manages Zoom browser sessions by delegating to the desktop-agent container:
    #   POST /v1/sessions/join           â†’ desktop-agent /v1/meeting/join (zoom)
    #   POST /v1/sessions/:id/share/start â†’ desktop-agent /v1/screen-share/inject (xdotool)
    #   POST /v1/sessions/:id/share/stop  â†’ session state update
    #   POST /v1/sessions/:id/leave       â†’ desktop-agent /v1/meeting/leave
    # No extra downloads â€” uses the desktop-agent's existing Playwright + Chromium.
    build:
      context: ./docker/zoom-video-sidecar
      dockerfile: Dockerfile
    container_name: agentfarm-zoom-video-sidecar
    profiles: [ voice ]
    ports:
      - '8091:8091'
    environment:
      PORT: '8091'
      DESKTOP_AGENT_URL: http://desktop-agent:5003
      SIDECAR_TOKEN: ${ZOOM_SIDECAR_TOKEN:-}
    depends_on:
      desktop-agent:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:8091/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentfarm
    restart: unless-stopped

  teams-media-bot:
    # Teams media bot sidecar â€” .NET 8 ASP.NET Core service that:
    #   1. Joins Teams calls using applicationHostedMediaConfig so the bot owns the media endpoint.
    #   2. Relays the desktop-agent FFmpeg HLS stream to the Teams media endpoint via RTP/SRTP.
    #   3. Handles Teams ICE/DTLS negotiation callbacks (POST /v1/callbacks/calls).
    #
    # Activate: COMPOSE_PROFILES=voice (same profile as the rest of the voice stack).
    #
    # DTLS/SRTP note: Teams rejects plain RTP. Full video injection requires either:
    #   (a) TEAMS_CALLBACK_BASE_URL set to a public HTTPS URL so Teams can send ICE/DTLS data, OR
    #   (b) The Windows-only Microsoft.Graph.Communications.Calls.Media SDK in an Azure Container.
    # Without DTLS, the sidecar still correctly manages the call control-plane and the HLS
    # pipeline is ready â€” only the crypto handshake is missing.
    build:
      context: ./docker/teams-media-bot
      dockerfile: Dockerfile
    container_name: agentfarm-teams-media-bot
    profiles: [ voice ]
    ports:
      - '8090:8090'
    environment:
      PORT: '8090'
      # Pass credentials so the sidecar can acquire Graph API tokens on its own.
      # These are also passed per-request from the meeting-agent, but env vars
      # provide a convenient fallback for health-check and diagnostic calls.
      TEAMS_TENANT_ID: ${TEAMS_TENANT_ID:-}
      TEAMS_CLIENT_ID: ${TEAMS_CLIENT_ID:-}
      TEAMS_CLIENT_SECRET: ${TEAMS_CLIENT_SECRET:-}
      TEAMS_CALLBACK_BASE_URL: ${TEAMS_CALLBACK_BASE_URL:-}
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:8090/health || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agentfarm
    restart: unless-stopped

  ngrok:
    # ngrok reverse tunnel â€” exposes teams-media-bot:8090 as a public HTTPS URL so
    # Teams can POST ICE/DTLS callbacks to it during local development.
    #
    # Activate: COMPOSE_PROFILES=voice (same as the rest of the voice stack).
    # Requires: NGROK_AUTHTOKEN env var (free account at https://dashboard.ngrok.com).
    #
    # The public URL is available at http://127.0.0.1:4040/api/tunnels once the
    # container is healthy. Run scripts/voice-dev.sh (or .ps1) to start the whole
    # voice stack and auto-inject the URL into teams-media-bot in one command.
    image: ngrok/ngrok:latest
    container_name: agentfarm-ngrok
    profiles: [ voice ]
    command: http teams-media-bot:8090 --log stdout
    ports:
      - '4040:4040'
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      teams-media-bot:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:4040/api/tunnels | grep -q "public_url" || exit 1' ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - agentfarm
    restart: unless-stopped

  # Cloudflare named tunnel — exposes api/dashboard/runtime.agentfarms.in publicly
  # without inbound ports. Routing (public hostnames) is managed in the Cloudflare
  # Zero Trust dashboard for tunnel "agentfarm". host networking so the dashboard's
  # localhost:3000/3001/4000 ingress rules resolve to the published service ports.
  # Requires CLOUDFLARE_TUNNEL_TOKEN in .env. No-op if the token is unset.
  cloudflared-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    network_mode: host
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  agent_data:
  gateway_secrets:
  # Voice model caches â€” persist across container restarts to avoid re-downloading.
  whisper_models:
  kokoro_models:
  xtts_models:
  mms_tts_models:
  # FreeSWITCH persistent state (call records, certificates).
  freeswitch_db:
  freeswitch_log:

networks:
  agentfarm:
    driver: bridge
