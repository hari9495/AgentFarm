name = "agent-farm"
compatibility_date = "2026-05-13"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages — static assets go to CDN (no size limit),
# server functions become small edge Functions (no 3 MiB Worker limit).
pages_build_output_dir = ".vercel/output/static"

# =============================================================================
# D1 database binding — used by website auth store
# =============================================================================

[[d1_databases]]
binding = "DB"
database_name = "agent-farm-db"
database_id = "eaeeb99f-cd57-4a6b-bace-2f2bf82bf113"

# =============================================================================
# Staging environment — PR preview deployments
# =============================================================================

[env.staging]
name = "agent-farm-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "agent-farm-db-staging"
database_id = "eaeeb99f-cd57-4a6b-bace-2f2bf82bf113"
