# OpenTelemetry Collector — ships AgentFarm Docker container logs, container
# metrics, and app traces/metrics to Axiom. VM *host* health (CPU/mem/disk/
# uptime) is intentionally NOT here — that lives in Azure Monitor (the VM is on
# Azure and the services already export to Application Insights).
#
# Enable with: docker compose --profile axiom up -d otel-collector
# Requires AXIOM_TOKEN (xaat-... API token) in the environment.

receivers:
  # App traces/metrics — services point OTEL_EXPORTER_OTLP_ENDPOINT here.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Docker container logs — read the json-file logs every container writes.
  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    include_file_path: true
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      # Pull the container id out of the log file path for filtering in Axiom.
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/'
      - type: move
        from: attributes.log
        to: body

  # Per-container CPU / memory / network metrics via the Docker socket.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    # Pin the Docker Engine API version (daemons reject the receiver's older
    # default negotiation). 1.40 is supported by all current engines.
    api_version: "1.40"
    collection_interval: 30s

processors:
  batch:
    timeout: 5s
  resourcedetection:
    detectors: [env, system]
    timeout: 5s
  # Per-customer attribution: stamp every log/metric with the VM's tenant id
  # (AF_TENANT_ID is set per customer VM). Lets the dashboards filter all infra
  # telemetry by customer, the same way audit events are tenant-tagged.
  resource/tenant:
    attributes:
      - key: tenant.id
        value: ${env:AF_TENANT_ID}
        action: upsert

exporters:
  otlphttp/axiom_logs:
    compression: gzip
    endpoint: ${env:AXIOM_URL}
    headers:
      authorization: Bearer ${env:AXIOM_TOKEN}
      x-axiom-dataset: ${env:AXIOM_DATASET_LOGS}

  otlphttp/axiom_traces:
    compression: gzip
    endpoint: ${env:AXIOM_URL}
    headers:
      authorization: Bearer ${env:AXIOM_TOKEN}
      x-axiom-dataset: ${env:AXIOM_DATASET_TRACES}

  otlphttp/axiom_metrics:
    compression: gzip
    endpoint: ${env:AXIOM_URL}
    headers:
      authorization: Bearer ${env:AXIOM_TOKEN}
      x-axiom-dataset: ${env:AXIOM_DATASET_METRICS}

service:
  pipelines:
    logs:
      receivers: [filelog, otlp]
      processors: [resource/tenant, resourcedetection, batch]
      exporters: [otlphttp/axiom_logs]
    traces:
      receivers: [otlp]
      processors: [resource/tenant, resourcedetection, batch]
      exporters: [otlphttp/axiom_traces]
    metrics:
      receivers: [otlp, docker_stats]
      processors: [resource/tenant, resourcedetection, batch]
      exporters: [otlphttp/axiom_metrics]
