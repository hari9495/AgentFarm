name = "agent-farm"
main = ".open-next/worker.js"
compatibility_date = "2026-05-13"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

# Static assets served from Cloudflare's CDN — no Worker size limit applies here.
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Load WASM files as WebAssembly modules instead of inlining them as binary
# in the Worker script. This removes resvg.wasm (~1.3 MB) and yoga.wasm (~86 KB)
# from the Worker bundle count and lets the runtime load them natively.
[[rules]]
globs = ["**/*.wasm"]
type = "CompiledWasm"

# =============================================================================
# D1 database binding — website auth store
# =============================================================================

[[d1_databases]]
binding = "DB"
database_name = "agent-farm-db"
database_id = "eaeeb99f-cd57-4a6b-bace-2f2bf82bf113"

# =============================================================================
# Production routes
# =============================================================================

[[routes]]
pattern = "agentfarms.in"
zone_name = "agentfarms.in"
custom_domain = true

[[routes]]
pattern = "www.agentfarms.in"
zone_name = "agentfarms.in"
custom_domain = true
