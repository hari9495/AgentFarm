name: Website — Cloudflare Pages Deploy

# Builds the Next.js website with @cloudflare/next-on-pages and deploys
# to Cloudflare Pages. Static assets go to Cloudflare's CDN (no size limit);
# server functions become small edge Functions (no 3 MiB Worker size limit).
#
# Required GitHub Secrets:
#   CF_API_TOKEN   — Cloudflare API token with "Cloudflare Pages: Edit" permission
#                    Create at: https://dash.cloudflare.com/profile/api-tokens
#   CF_ACCOUNT_ID  — Your Cloudflare account ID (dash.cloudflare.com → right sidebar)
#
# Required GitHub Variables (Settings → Variables → Actions):
#   NEXT_PUBLIC_API_URL
#   NEXT_PUBLIC_SITE_URL
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_FORMSPREE_ID

on:
  push:
    branches:
      - main
    paths:
      - apps/website/**
      - packages/**
      - .github/workflows/website-cf-deploy.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/website/**
      - packages/**
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @agentfarm/shared-types build

      - name: Build website (Next.js → Cloudflare Pages output)
        working-directory: apps/website
        env:
          NODE_ENV: production
          # Public env vars baked into the static build
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_WAITLIST_PROVIDER: ${{ vars.NEXT_PUBLIC_WAITLIST_PROVIDER || 'formspree' }}
          NEXT_PUBLIC_FORMSPREE_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_MAINTENANCE_MODE: 'false'
        run: |
          pnpm next build --no-lint
          npx @cloudflare/next-on-pages

      - name: Run D1 migrations (production only)
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply agent-farm-db --remote

      - name: Deploy to Cloudflare Pages (production)
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .vercel/output/static \
            --project-name=agent-farm \
            --branch=main \
            --commit-dirty=true

      - name: Deploy to Cloudflare Pages (staging / PR preview)
        if: github.event_name == 'pull_request' || github.event.inputs.environment == 'staging'
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        id: pages_preview
        run: |
          npx wrangler pages deploy .vercel/output/static \
            --project-name=agent-farm \
            --branch=preview-${{ github.event.pull_request.number || 'staging' }} \
            --commit-dirty=true 2>&1 | tee deploy_output.txt
          PREVIEW_URL=$(grep -oP 'https://[a-z0-9\-]+\.agent-farm\.pages\.dev' deploy_output.txt | head -1)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Post preview URL to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.pages_preview.outputs.preview_url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Cloudflare Pages preview deployed.**\n\n${previewUrl || 'Check Cloudflare dashboard for preview URL.'}`
            });
