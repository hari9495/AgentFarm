name: Cloudflare WAF — Deploy Rules

# Applies Terraform-managed Cloudflare WAF + rate limiting rules.
#
# Required GitHub Secrets:
#   CF_API_TOKEN      — Cloudflare API token (Zone:Read, Zone:Edit,
#                       Firewall Services:Edit, Rate Limiting:Edit)
#   CF_ACCOUNT_ID     — Cloudflare Account ID
#
# Runs on:
#   - Push to main when infrastructure/cloudflare/** changes
#   - Manual dispatch (with plan-only option for dry runs)

on:
  push:
    branches:
      - main
    paths:
      - infrastructure/cloudflare/**
      - .github/workflows/cloudflare-waf-deploy.yml
  pull_request:
    branches:
      - main
    paths:
      - infrastructure/cloudflare/**
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: "1.7.5"
  WORKING_DIR: infrastructure/cloudflare

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || (github.event_name == 'pull_request' && 'plan' || 'apply') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_zone_name: agentfarms.in
        run: terraform plan -out=tfplan -no-color
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = `${{ steps.plan.outputs.stdout }}`.substring(0, 60000);
            const status = '${{ steps.plan.outcome }}';
            const emoji = status === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${emoji} Cloudflare WAF — Terraform Plan\n\`\`\`\n${plan}\n\`\`\``
            });

      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          github.event.inputs.action == 'apply'
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_zone_name: agentfarms.in
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy (manual only)
        if: github.event.inputs.action == 'destroy'
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_zone_name: agentfarms.in
        run: terraform destroy -auto-approve
