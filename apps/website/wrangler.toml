name = "agent-farm"
main = ".open-next/worker.js"
compatibility_date = "2026-05-13"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

# Static assets served from Cloudflare's CDN — no Worker size limit applies here.
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# =============================================================================
# D1 database binding — website auth store
# =============================================================================

[[d1_databases]]
binding = "DB"
database_name = "agent-farm-db"
database_id = "eaeeb99f-cd57-4a6b-bace-2f2bf82bf113"

# =============================================================================
# Runtime environment variables — available via process.env in API routes
# =============================================================================

[vars]
API_GATEWAY_URL = "https://api.agentfarms.in"
NEXT_PUBLIC_API_URL = "https://api.agentfarms.in"
NEXT_PUBLIC_SITE_URL = "https://agentfarms.in"

# =============================================================================
# Custom domains — DNS conflict resolved; CNAME for www deleted 2026-06-09
# =============================================================================

[[routes]]
pattern = "agentfarms.in"
zone_name = "agentfarms.in"
custom_domain = true

[[routes]]
pattern = "www.agentfarms.in"
zone_name = "agentfarms.in"
custom_domain = true

