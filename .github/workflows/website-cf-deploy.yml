name: Website — Cloudflare Workers Deploy

# Builds the Next.js website with @opennextjs/cloudflare and deploys to
# Cloudflare Workers. Static assets go to Cloudflare's CDN via the ASSETS
# binding; WASM files are loaded as WebAssembly modules (not inlined).
#
# Required GitHub Secrets:
#   CF_API_TOKEN   — Cloudflare API token with "Workers Scripts: Edit",
#                    "Workers Routes: Edit", "Zone: Edit" permissions.
#                    Create: https://dash.cloudflare.com/profile/api-tokens
#   CF_ACCOUNT_ID  — Cloudflare Account ID (dash.cloudflare.com right sidebar)
#
# Required GitHub Variables (Settings → Variables → Actions):
#   NEXT_PUBLIC_API_URL
#   NEXT_PUBLIC_SITE_URL
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_FORMSPREE_ID

on:
  push:
    branches:
      - main
    paths:
      - apps/website/**
      - packages/**
      - .github/workflows/website-cf-deploy.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/website/**
      - packages/**
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @agentfarm/shared-types build

      - name: Build website (Next.js + OpenNext Cloudflare)
        working-directory: apps/website
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_WAITLIST_PROVIDER: ${{ vars.NEXT_PUBLIC_WAITLIST_PROVIDER || 'formspree' }}
          NEXT_PUBLIC_FORMSPREE_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_MAINTENANCE_MODE: 'false'
        run: pnpm build:cf

      - name: Check Cloudflare credentials
        id: cf-check
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CF_API_TOKEN secret is not set — skipping D1 migrations and deploy."
          fi
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Run D1 migrations
        if: (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production') && steps.cf-check.outputs.available == 'true'
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r')
          export CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\n\r')
          pnpm wrangler d1 migrations apply agent-farm-db --remote

      - name: Deploy to Cloudflare Workers
        if: (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production') && steps.cf-check.outputs.available == 'true'
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\n\r')
          export CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\n\r')
          pnpm wrangler deploy --env=""
