name: Website — Cloudflare Workers Deploy

# Replaces website-swa.yml (Azure Static Web Apps).
# Builds the Next.js website with OpenNext and deploys to Cloudflare Workers.
#
# Required GitHub secrets:
#   CF_API_TOKEN   — Cloudflare API token with "Workers Scripts: Edit" +
#                    "Workers Routes: Edit" + "D1: Edit" permissions.
#                    Create at: https://dash.cloudflare.com/profile/api-tokens
#   CF_ACCOUNT_ID  — Your Cloudflare account ID (dash.cloudflare.com → right sidebar)
#
# Required GitHub variables (Settings → Variables → Actions):
#   NEXT_PUBLIC_API_URL          — e.g. https://api.agentfarms.in
#   NEXT_PUBLIC_SITE_URL         — e.g. https://agentfarms.in
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_RAZORPAY_KEY_ID  — (optional)

on:
  push:
    branches:
      - main
    paths:
      - apps/website/**
      - packages/**
      - .github/workflows/website-cf-deploy.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/website/**
      - packages/**
      - .github/workflows/website-cf-deploy.yml
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-and-deploy:
    name: Build & Deploy (${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @agentfarm/shared-types build

      - name: Build website (Next.js)
        working-directory: apps/website
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_WAITLIST_PROVIDER: ${{ vars.NEXT_PUBLIC_WAITLIST_PROVIDER || 'formspree' }}
          NEXT_PUBLIC_FORMSPREE_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_MAINTENANCE_MODE: 'false'
        run: pnpm next build --no-lint

      - name: Build OpenNext Cloudflare bundle
        working-directory: apps/website
        run: pnpm dlx opennextjs-cloudflare build

      - name: Run D1 migrations (production)
        if: ${{ github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production' }}
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          pnpm wrangler d1 migrations apply agent-farm-db --remote

      - name: Deploy to Cloudflare Workers (production)
        if: ${{ github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production' }}
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm wrangler deploy

      - name: Deploy to Cloudflare Workers (staging)
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.environment == 'staging' }}
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm wrangler deploy --env staging

      - name: Post deployment URL to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Staging deploy complete.**\nPreview: https://agent-farm-staging.workers.dev'
            })
